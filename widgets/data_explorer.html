<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { font: 14px system-ui; margin: 0; padding: 16px; background: var(--bg, #fff); color: var(--fg, #000); }
  .header { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .header h2 { margin: 0; font-size: 18px; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .badge-england { background: #e3f2fd; color: #1565c0; }
  .badge-scotland { background: #fce4ec; color: #c2185b; }
  .badge-wales { background: #e8f5e9; color: #2e7d32; }
  .section { margin-bottom: 24px; }
  .section h3 { margin: 0 0 12px; font-size: 16px; border-bottom: 1px solid var(--border, #ddd); padding-bottom: 8px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .detail-card { padding: 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--panel-bg, #fafafa); }
  .detail-card h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted, #666); text-transform: uppercase; }
  .detail-card p { margin: 0; font-size: 14px; word-break: break-word; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border, #ddd); }
  .data-table th { background: var(--panel-bg, #fafafa); font-weight: 600; position: sticky; top: 0; }
  .data-table tr:hover { background: var(--hover-bg, #f5f5f5); }
  .empty { padding: 24px; text-align: center; color: var(--muted, #666); }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border, #ddd); }
  .tab { padding: 8px 16px; cursor: pointer; border: none; background: transparent; color: var(--muted, #666); font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--fg, #000); border-bottom-color: var(--accent, #1976d2); font-weight: 500; }
  .tab:hover { color: var(--fg, #000); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --fg: #e0e0e0; --muted: #999; --border: #333; --panel-bg: #222; --hover-bg: #2a2a2a; --accent: #90caf9; }
    .badge-england { background: #1a3a5c; color: #90caf9; }
    .badge-scotland { background: #5c1a3a; color: #f48fb1; }
    .badge-wales { background: #1a5c1a; color: #81c784; }
  }
</style>
<div class="header">
  <h2>🔍 Dataset Explorer</h2>
  <span class="badge" id="nationBadge"></span>
</div>
<div class="tabs" id="tabs"></div>

<div class="tab-panel active" id="panel-overview">
  <div class="section">
    <h3>Overview</h3>
    <div class="detail-grid" id="overviewGrid"></div>
  </div>
</div>

<div class="tab-panel" id="panel-coverage">
  <div class="section">
    <h3>Coverage</h3>
    <table class="data-table" id="coverageTable"><thead></thead><tbody></tbody></table>
  </div>
</div>

<div class="tab-panel" id="panel-completeness">
  <div class="section">
    <h3>Completeness</h3>
    <table class="data-table" id="completenessTable"><thead></thead><tbody></tbody></table>
  </div>
</div>

<div class="tab-panel" id="panel-dictionary">
  <div class="section">
    <h3>Data Dictionary</h3>
    <table class="data-table" id="dictionaryTable"><thead></thead><tbody></tbody></table>
  </div>
</div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

const app = new App({ name: "DataExplorer", version: "1.0.0" }, { autoResize: true });

function applyTheme(ctx) {
  if (ctx?.theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}

app.onhostcontextchanged = ({ context }) => applyTheme(context);
app.getHostContext().then(applyTheme);

app.ontoolresult = ({ content }) => {
  try {
    const text = content[0]?.text || "{}";
    const data = JSON.parse(text);
    renderData(data);
  } catch (e) {
    console.error("Error parsing tool result:", e);
  }
};

function escapeHtml(text) {
  if (!text) return "";
  return String(text)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "&#039;");
}

function renderData(data) {
  const { datasetName, nation, overview, coverage, completeness, dataDictionary } = data;
  
  // Update header
  document.getElementById("nationBadge").textContent = nation;
  document.getElementById("nationBadge").className = `badge badge-${nation.toLowerCase()}`;
  
  // Setup tabs
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = `
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="coverage">Coverage (${coverage?.length || 0})</button>
    <button class="tab" data-tab="completeness">Completeness (${completeness?.length || 0})</button>
    <button class="tab" data-tab="dictionary">Data Dictionary (${dataDictionary?.length || 0})</button>
  `;
  
  tabs.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });
  
  // Render overview
  renderOverview(overview);
  
  // Render tables
  renderTable("coverageTable", coverage);
  renderTable("completenessTable", completeness);
  renderTable("dictionaryTable", dataDictionary);
}

function switchTab(tabName) {
  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tabName);
  });
  document.querySelectorAll(".tab-panel").forEach(panel => {
    panel.classList.toggle("active", panel.id === `panel-${tabName}`);
  });
}

function renderOverview(overview) {
  const grid = document.getElementById("overviewGrid");
  if (!overview) {
    grid.innerHTML = '<div class="empty">No overview data available</div>';
    return;
  }
  
  const fields = [
    { key: "dataset", label: "Dataset" },
    { key: "archived_on", label: "Archived On" },
    { key: "n", label: "Total Records" },
    { key: "n_id", label: "Total IDs" },
    { key: "n_id_distinct", label: "Distinct IDs" },
    { key: "n_distinct", label: "Distinct IDs (alt)" },
  ];
  
  grid.innerHTML = fields.map(f => {
    const value = overview[f.key];
    if (value === undefined || value === null || value === "") return "";
    return `
      <div class="detail-card">
        <h4>${f.label}</h4>
        <p>${escapeHtml(String(value))}</p>
      </div>
    `;
  }).join("");
}

function renderTable(tableId, data) {
  const table = document.getElementById(tableId);
  const thead = table.querySelector("thead");
  const tbody = table.querySelector("tbody");
  
  if (!data || data.length === 0) {
    thead.innerHTML = "";
    tbody.innerHTML = '<tr><td class="empty" colspan="100%">No data available</td></tr>';
    return;
  }
  
  // Get all unique keys from all rows
  const keys = [...new Set(data.flatMap(row => Object.keys(row)))];
  
  thead.innerHTML = `<tr>${keys.map(k => `<th>${escapeHtml(k)}</th>`).join("")}</tr>`;
  tbody.innerHTML = data.map(row => 
    `<tr>${keys.map(k => `<td>${escapeHtml(String(row[k] ?? ""))}</td>`).join("")}</tr>`
  ).join("");
}

await app.connect();
</script>
