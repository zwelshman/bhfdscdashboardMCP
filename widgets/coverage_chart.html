<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { font: 14px system-ui; margin: 0; padding: 16px; background: var(--bg, #fff); color: var(--fg, #000); }
  .header { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .header h2 { margin: 0; font-size: 18px; }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted, #666); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; text-transform: uppercase; color: var(--muted, #666); }
  select { padding: 8px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--input-bg, #fff); color: var(--fg, #000); font-size: 13px; }
  .chart-container { height: 400px; position: relative; }
  .chart-bars { display: flex; align-items: flex-end; height: 100%; gap: 4px; padding: 20px 0; overflow-x: auto; }
  .chart-bar-group { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 60px; }
  .chart-bar { width: 100%; max-width: 40px; border-radius: 4px 4px 0 0; transition: height 0.3s ease, opacity 0.2s; cursor: pointer; }
  .chart-bar:hover { opacity: 0.8; }
  .chart-bar.england { background: #1976d2; }
  .chart-bar.scotland { background: #c2185b; }
  .chart-bar.wales { background: #2e7d32; }
  .chart-label { writing-mode: vertical-rl; text-orientation: mixed; font-size: 10px; margin-top: 8px; text-align: center; height: 60px; overflow: hidden; }
  .chart-value { font-size: 11px; font-weight: 500; margin-bottom: 4px; }
  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 12px; height: 12px; border-radius: 2px; }
  .table-container { max-height: 400px; overflow: auto; border: 1px solid var(--border, #ddd); border-radius: 4px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border, #ddd); }
  .data-table th { background: var(--panel-bg, #fafafa); font-weight: 600; position: sticky; top: 0; }
  .data-table tr:hover { background: var(--hover-bg, #f5f5f5); }
  .empty { padding: 32px; text-align: center; color: var(--muted, #666); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --fg: #e0e0e0; --muted: #999; --border: #333; --input-bg: #2a2a2a; --panel-bg: #222; --hover-bg: #2a2a2a; }
  }
</style>
<div class="header">
  <h2>📈 Coverage Chart</h2>
  <div class="stats" id="stats"></div>
</div>
<div class="filters">
  <div class="filter-group">
    <label>Nation</label>
    <select id="nationFilter">
      <option value="All">All Nations</option>
      <option value="England">England</option>
      <option value="Scotland">Scotland</option>
      <option value="Wales">Wales</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Dataset</label>
    <select id="datasetFilter">
      <option value="">All Datasets</option>
    </select>
  </div>
</div>
<div class="chart-container" id="chartContainer"></div>
<div class="legend" id="legend"></div>
<div class="table-container" id="tableContainer"></div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

let allData = [];
let currentView = "chart"; // "chart" or "table"

const app = new App({ name: "CoverageChart", version: "1.0.0" }, { autoResize: true });
const chartContainer = document.getElementById("chartContainer");
const legendEl = document.getElementById("legend");
const tableContainer = document.getElementById("tableContainer");
const statsEl = document.getElementById("stats");
const nationFilter = document.getElementById("nationFilter");
const datasetFilter = document.getElementById("datasetFilter");

function applyTheme(ctx) {
  if (ctx?.theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}

app.onhostcontextchanged = ({ context }) => applyTheme(context);
app.getHostContext().then(applyTheme);

app.ontoolresult = ({ content }) => {
  try {
    const text = content[0]?.text || "{}";
    const data = JSON.parse(text);
    allData = data.coverageData || [];
    
    // Update stats
    statsEl.textContent = `Showing ${allData.length} records`;
    
    // Populate dataset filter
    const datasets = [...new Set(allData.map(d => d.dataset || d.Dataset).filter(Boolean))].sort();
    datasetFilter.innerHTML = '<option value="">All Datasets</option>' + 
      datasets.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join("");
    
    // Restore filters
    if (data.nation) nationFilter.value = data.nation;
    if (data.dataset) datasetFilter.value = data.dataset;
    
    render();
  } catch (e) {
    console.error("Error parsing tool result:", e);
  }
};

function escapeHtml(text) {
  if (!text) return "";
  return String(text)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "&#039;");
}

function render() {
  const nation = nationFilter.value;
  const dataset = datasetFilter.value;
  
  let filtered = allData;
  if (nation !== "All") filtered = filtered.filter(d => d.nation === nation);
  if (dataset) filtered = filtered.filter(d => (d.dataset || d.Dataset) === dataset);
  
  if (filtered.length === 0) {
    chartContainer.innerHTML = '<div class="empty">No data matches your filters</div>';
    tableContainer.innerHTML = '';
    return;
  }
  
  // Aggregate by dataset for chart
  const aggregated = aggregateData(filtered);
  renderChart(aggregated);
  renderTable(filtered);
  renderLegend();
}

function aggregateData(data) {
  const map = new Map();
  for (const row of data) {
    const key = row.dataset || row.Dataset;
    if (!key) continue;
    if (!map.has(key)) {
      map.set(key, { dataset: key, england: 0, scotland: 0, wales: 0, count: 0 });
    }
    const agg = map.get(key);
    agg.count++;
    const nation = row.nation?.toLowerCase();
    if (nation === "england") agg.england += parseFloat(row.coverage_pct || row.coverage || 0);
    else if (nation === "scotland") agg.scotland += parseFloat(row.coverage_pct || row.coverage || 0);
    else if (nation === "wales") agg.wales += parseFloat(row.coverage_pct || row.coverage || 0);
  }
  // Average the values
  for (const agg of map.values()) {
    const nations = ["england", "scotland", "wales"].filter(n => agg[n] > 0).length;
    if (nations > 0) {
      agg.england = agg.england / (agg.england > 0 ? 1 : nations);
      agg.scotland = agg.scotland / (agg.scotland > 0 ? 1 : nations);
      agg.wales = agg.wales / (agg.wales > 0 ? 1 : nations);
    }
  }
  return Array.from(map.values()).sort((a, b) => b.count - a.count).slice(0, 20);
}

function renderChart(data) {
  if (data.length === 0) {
    chartContainer.innerHTML = '<div class="empty">No data to chart</div>';
    return;
  }
  
  const maxVal = Math.max(...data.flatMap(d => [d.england, d.scotland, d.wales]));
  
  chartContainer.innerHTML = `
    <div class="chart-bars">
      ${data.map(d => `
        <div class="chart-bar-group" title="${escapeHtml(d.dataset)}">
          ${d.england > 0 ? `<div class="chart-bar england" style="height: ${(d.england / maxVal) * 100}%"></div>` : ""}
          ${d.scotland > 0 ? `<div class="chart-bar scotland" style="height: ${(d.scotland / maxVal) * 100}%"></div>` : ""}
          ${d.wales > 0 ? `<div class="chart-bar wales" style="height: ${(d.wales / maxVal) * 100}%"></div>` : ""}
          <div class="chart-value">${d.count} records</div>
          <div class="chart-label">${escapeHtml(d.dataset.substring(0, 30))}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderTable(data) {
  if (data.length === 0) {
    tableContainer.innerHTML = '';
    return;
  }
  
  const keys = ["dataset", "nation", "coverage_pct", "coverage", "period_start", "period_end", "n", "n_id"];
  const displayKeys = keys.filter(k => data.some(row => row[k] !== undefined));
  
  tableContainer.innerHTML = `
    <table class="data-table">
      <thead><tr>${displayKeys.map(k => `<th>${escapeHtml(k)}</th>`).join("")}</tr></thead>
      <tbody>
        ${data.slice(0, 100).map(row => 
          `<tr>${displayKeys.map(k => `<td>${escapeHtml(String(row[k] ?? ""))}</td>`).join("")}</tr>`
        ).join("")}
      </tbody>
    </table>
  `;
}

function renderLegend() {
  legendEl.innerHTML = `
    <div class="legend-item"><span class="legend-color" style="background: #1976d2"></span>England</div>
    <div class="legend-item"><span class="legend-color" style="background: #c2185b"></span>Scotland</div>
    <div class="legend-item"><span class="legend-color" style="background: #2e7d32"></span>Wales</div>
  `;
}

// Filter event listeners
[nationFilter, datasetFilter].forEach(el => {
  el.addEventListener("change", render);
});

await app.connect();
</script>
