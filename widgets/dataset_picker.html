<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { font: 14px system-ui; margin: 0; padding: 16px; background: var(--bg, #fff); color: var(--fg, #000); }
  .header { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .header h2 { margin: 0; font-size: 18px; }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted, #666); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; text-transform: uppercase; color: var(--muted, #666); }
  select, input { padding: 8px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--input-bg, #fff); color: var(--fg, #000); font-size: 13px; }
  input { flex: 1; min-width: 200px; }
  .dataset-list { max-height: 500px; overflow-y: auto; border: 1px solid var(--border, #ddd); border-radius: 4px; }
  .dataset-item { padding: 12px 16px; border-bottom: 1px solid var(--border, #ddd); cursor: pointer; transition: background 0.15s; }
  .dataset-item:last-child { border-bottom: none; }
  .dataset-item:hover { background: var(--hover-bg, #f5f5f5); }
  .dataset-item.selected { background: var(--select-bg, #e8f0fe); }
  .dataset-title { font-weight: 600; margin-bottom: 4px; }
  .dataset-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted, #666); flex-wrap: wrap; }
  .dataset-desc { margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--fg, #333); }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .badge-england { background: #e3f2fd; color: #1565c0; }
  .badge-scotland { background: #fce4ec; color: #c2185b; }
  .badge-wales { background: #e8f5e9; color: #2e7d32; }
  .empty { padding: 32px; text-align: center; color: var(--muted, #666); }
  .detail-panel { margin-top: 16px; padding: 16px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--panel-bg, #fafafa); }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .detail-label { font-weight: 500; min-width: 140px; }
  .detail-value { flex: 1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --fg: #e0e0e0; --muted: #999; --border: #333; --input-bg: #2a2a2a; --hover-bg: #2a2a2a; --select-bg: #1a3a5c; --panel-bg: #222; }
    .badge-england { background: #1a3a5c; color: #90caf9; }
    .badge-scotland { background: #5c1a3a; color: #f48fb1; }
    .badge-wales { background: #1a5c1a; color: #81c784; }
  }
</style>
<div class="header">
  <h2>📊 TRE Dataset Explorer</h2>
  <div class="stats" id="stats"></div>
</div>
<div class="filters">
  <div class="filter-group">
    <label>Nation</label>
    <select id="nationFilter">
      <option value="All">All Nations</option>
      <option value="England">England</option>
      <option value="Scotland">Scotland</option>
      <option value="Wales">Wales</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Group</label>
    <select id="groupFilter">
      <option value="">All Groups</option>
    </select>
  </div>
  <div class="filter-group" style="flex: 1;">
    <label>Search</label>
    <input type="text" id="searchInput" placeholder="Search datasets...">
  </div>
</div>
<div class="dataset-list" id="datasetList"></div>
<div class="detail-panel" id="detailPanel" style="display: none;"></div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

let allDatasets = [];
let selectedDataset = null;

const app = new App({ name: "DatasetPicker", version: "1.0.0" }, { autoResize: true });
const listEl = document.getElementById("datasetList");
const statsEl = document.getElementById("stats");
const nationFilter = document.getElementById("nationFilter");
const groupFilter = document.getElementById("groupFilter");
const searchInput = document.getElementById("searchInput");
const detailPanel = document.getElementById("detailPanel");

function applyTheme(ctx) {
  if (ctx?.theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}

app.onhostcontextchanged = ({ context }) => applyTheme(context);
app.getHostContext().then(applyTheme);

app.ontoolresult = ({ content }) => {
  try {
    const text = content[0]?.text || "{}";
    const data = JSON.parse(text);
    allDatasets = data.datasets || [];
    
    // Update stats
    statsEl.innerHTML = `
      <span>Total: ${data.totalCount}</span>
      <span>Showing: ${allDatasets.length}</span>
      <span>Nations: ${data.nations?.join(", ") || "N/A"}</span>
    `;
    
    // Populate group filter
    const groups = [...new Set(allDatasets.map(d => d.Group).filter(Boolean))].sort();
    groupFilter.innerHTML = '<option value="">All Groups</option>' + 
      groups.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("");
    
    // Restore filters if they were in the data
    if (data.filters) {
      nationFilter.value = data.filters.nation || "All";
      groupFilter.value = data.filters.group || "";
      searchInput.value = data.filters.search || "";
    }
    
    renderList();
  } catch (e) {
    console.error("Error parsing tool result:", e);
  }
};

function escapeHtml(text) {
  if (!text) return "";
  return String(text)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "&#039;");
}

function renderList() {
  const nation = nationFilter.value;
  const group = groupFilter.value;
  const search = searchInput.value.toLowerCase();
  
  let filtered = allDatasets;
  if (nation !== "All") filtered = filtered.filter(d => d.Nation === nation);
  if (group) filtered = filtered.filter(d => d.Group === group);
  if (search) filtered = filtered.filter(d => 
    (d.Title?.toLowerCase().includes(search)) ||
    (d.Description?.toLowerCase().includes(search)) ||
    (d.Dataset?.toLowerCase().includes(search))
  );
  
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">No datasets match your filters</div>';
    return;
  }
  
  listEl.innerHTML = filtered.map((d, idx) => `
    <div class="dataset-item ${selectedDataset === d.Dataset ? "selected" : ""}" data-index="${idx}" data-dataset="${escapeHtml(d.Dataset)}">
      <div class="dataset-title">${escapeHtml(d.Title || d.Dataset)}</div>
      <div class="dataset-meta">
        <span class="badge badge-${(d.Nation || "").toLowerCase()}">${escapeHtml(d.Nation || "Unknown")}</span>
        <span>${escapeHtml(d.Group || "No Group")}</span>
        <span>${escapeHtml(d.Shortname || d.table || "")}</span>
      </div>
      <div class="dataset-desc">${escapeHtml((d.Description || "").substring(0, 200))}${d.Description?.length > 200 ? "..." : ""}</div>
    </div>
  `).join("");
  
  // Add click handlers
  listEl.querySelectorAll(".dataset-item").forEach(item => {
    item.addEventListener("click", () => selectDataset(item.dataset.dataset));
  });
}

function selectDataset(datasetName) {
  selectedDataset = datasetName;
  const dataset = allDatasets.find(d => d.Dataset === datasetName);
  
  // Update selection visual
  listEl.querySelectorAll(".dataset-item").forEach(item => {
    item.classList.toggle("selected", item.dataset.dataset === datasetName);
  });
  
  if (dataset) {
    detailPanel.style.display = "block";
    detailPanel.innerHTML = `
      <h3 style="margin: 0 0 12px;">${escapeHtml(dataset.Title || dataset.Dataset)}</h3>
      <div class="detail-row"><span class="detail-label">Dataset ID:</span><span class="detail-value">${escapeHtml(dataset.Dataset)}</span></div>
      <div class="detail-row"><span class="detail-label">Nation:</span><span class="detail-value"><span class="badge badge-${(dataset.Nation || "").toLowerCase()}">${escapeHtml(dataset.Nation)}</span></span></div>
      <div class="detail-row"><span class="detail-label">Group:</span><span class="detail-value">${escapeHtml(dataset.Group)}</span></div>
      <div class="detail-row"><span class="detail-label">Table:</span><span class="detail-value">${escapeHtml(dataset.table)}</span></div>
      <div class="detail-row"><span class="detail-label">Shortname:</span><span class="detail-value">${escapeHtml(dataset.Shortname)}</span></div>
      <div class="detail-row"><span class="detail-label">Start Date:</span><span class="detail-value">${escapeHtml(dataset.start_date)}</span></div>
      <div class="detail-row"><span class="detail-label">Coverage:</span><span class="detail-value">${escapeHtml(dataset.coverage)}</span></div>
      <div class="detail-row"><span class="detail-label">Dictionary:</span><span class="detail-value">${escapeHtml(dataset.dictionary)}</span></div>
      <div class="detail-row"><span class="detail-label">Description:</span><span class="detail-value">${escapeHtml(dataset.Description)}</span></div>
      <div class="detail-row"><span class="detail-label">URLs:</span><span class="detail-value">
        ${dataset.url1 ? `<a href="${escapeHtml(dataset.url1)}" target="_blank">${escapeHtml(dataset.url1)}</a>` : ""}
        ${dataset.url2 ? `<br><a href="${escapeHtml(dataset.url2)}" target="_blank">${escapeHtml(dataset.url2)}</a>` : ""}
      </span></div>
    `;
  }
  
  // Send selection to host
  app.sendMessage({
    role: "user",
    content: [{ type: "text", text: `Selected dataset: ${datasetName} (${dataset?.Title || ""})` }]
  });
}

// Filter event listeners
[nationFilter, groupFilter, searchInput].forEach(el => {
  el.addEventListener("input", renderList);
  el.addEventListener("change", renderList);
});

await app.connect();
</script>
