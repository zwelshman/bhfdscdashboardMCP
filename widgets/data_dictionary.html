<!doctype html>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { font: 14px system-ui; margin: 0; padding: 16px; background: var(--bg, #fff); color: var(--fg, #000); }
  .header { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .header h2 { margin: 0; font-size: 18px; }
  .stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted, #666); }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; text-transform: uppercase; color: var(--muted, #666); }
  input { padding: 8px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; background: var(--input-bg, #fff); color: var(--fg, #000); font-size: 13px; flex: 1; min-width: 200px; }
  .table-container { max-height: 500px; overflow: auto; border: 1px solid var(--border, #ddd); border-radius: 4px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th, .data-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border, #ddd); }
  .data-table th { background: var(--panel-bg, #fafafa); font-weight: 600; position: sticky; top: 0; }
  .data-table tr:hover { background: var(--hover-bg, #f5f5f5); }
  .empty { padding: 32px; text-align: center; color: var(--muted, #666); }
  .field-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .type-continuous { background: #e3f2fd; color: #1565c0; }
  .type-categorical { background: #f3e5f5; color: #7b1fa2; }
  .type-date { background: #e8f5e9; color: #2e7d32; }
  .type-text { background: #fff3e0; color: #e65100; }
  .type-other { background: #f5f5f5; color: #616161; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a1a; --fg: #e0e0e0; --muted: #999; --border: #333; --input-bg: #2a2a2a; --panel-bg: #222; --hover-bg: #2a2a2a; }
    .type-continuous { background: #1a3a5c; color: #90caf9; }
    .type-categorical { background: #3a1a5c; color: #ce93d8; }
    .type-date { background: #1a5c1a; color: #81c784; }
    .type-text { background: #5c3a1a; color: #ffb74d; }
    .type-other { background: #333; color: #999; }
  }
</style>
<div class="header">
  <h2>📚 Data Dictionary Explorer</h2>
  <div class="stats" id="stats"></div>
</div>
<div class="filters">
  <div class="filter-group" style="flex: 1;">
    <label>Search Fields</label>
    <input type="text" id="searchInput" placeholder="Search field names, descriptions, types...">
  </div>
</div>
<div class="table-container" id="tableContainer"></div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

let allData = [];
let currentDataset = "";

const app = new App({ name: "DataDictionary", version: "1.0.0" }, { autoResize: true });
const tableContainer = document.getElementById("tableContainer");
const statsEl = document.getElementById("stats");
const searchInput = document.getElementById("searchInput");

function applyTheme(ctx) {
  if (ctx?.theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}

app.onhostcontextchanged = ({ context }) => applyTheme(context);
app.getHostContext().then(applyTheme);

app.ontoolresult = ({ content }) => {
  try {
    const text = content[0]?.text || "{}";
    const data = JSON.parse(text);
    currentDataset = data.dataset || "";
    allData = data.dataDictionary || [];
    
    statsEl.textContent = `Dataset: ${currentDataset} | Fields: ${allData.length} | Search: ${data.search || "none"}`;
    
    if (data.search) searchInput.value = data.search;
    
    renderTable();
  } catch (e) {
    console.error("Error parsing tool result:", e);
  }
};

function escapeHtml(text) {
  if (!text) return "";
  return String(text)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "&#039;");
}

function getTypeClass(type) {
  if (!type) return "type-other";
  const t = type.toLowerCase();
  if (t.includes("continuous")) return "type-continuous";
  if (t.includes("categorical")) return "type-categorical";
  if (t.includes("date") || t.includes("time") || t.includes("datetime")) return "type-date";
  if (t.includes("text") || t.includes("string") || t.includes("varchar") || t.includes("char")) return "type-text";
  return "type-other";
}

function renderTable() {
  const search = searchInput.value.toLowerCase();
  
  let filtered = allData;
  if (search) {
    filtered = allData.filter(row => 
      row.some(cell => String(cell).toLowerCase().includes(search))
    );
  }
  
  if (filtered.length === 0) {
    tableContainer.innerHTML = '<div class="empty">No fields match your search</div>';
    return;
  }
  
  // Assume first row is header
  const headers = filtered[0] || [];
  const rows = filtered.slice(1);
  
  // Find important column indices
  const fieldNameIdx = headers.findIndex(h => String(h).toLowerCase().includes("field") || String(h).toLowerCase().includes("name") || String(h).toLowerCase().includes("display"));
  const descIdx = headers.findIndex(h => String(h).toLowerCase().includes("description") || String(h).toLowerCase().includes("label"));
  const typeIdx = headers.findIndex(h => String(h).toLowerCase().includes("type") || String(h).toLowerCase().includes("var_type"));
  
  tableContainer.innerHTML = `
    <table class="data-table">
      <thead>
        <tr>${headers.map(h => `<th>${escapeHtml(String(h))}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${rows.slice(0, 500).map(row => `
          <tr>
            ${row.map((cell, idx) => {
              let content = escapeHtml(String(cell ?? ""));
              if (idx === typeIdx && cell) {
                content = `<span class="field-type ${getTypeClass(cell)}">${escapeHtml(String(cell))}</span>`;
              }
              return `<td>${content}</td>`;
            }).join("")}
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

searchInput.addEventListener("input", renderTable);

await app.connect();
</script>
